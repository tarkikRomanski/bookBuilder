<div (click)="onCardClick()" 
     class="glass-card glass-card-hover p-5 flex flex-col justify-between h-full group relative cursor-pointer">

  <div>
    <!-- Cover Display Area with Blurred Background & Full Uncropped Portrait Cover -->
    <div class="relative w-full h-56 rounded-xl bg-slate-950 overflow-hidden mb-4 border border-slate-800 shadow-inner flex items-center justify-center p-2">
      <!-- Blurred Backdrop Cover Image -->
      <div *ngIf="book.screen" 
           class="absolute inset-0 bg-cover bg-center opacity-25 filter blur-lg scale-110 pointer-events-none"
           [style.background-image]="'url(' + getCorrectBase64(book.screen) + ')'">
      </div>
      <div class="absolute inset-0 bg-slate-950/40 pointer-events-none"></div>

      <!-- Crisp Uncropped Cover Image -->
      <img *ngIf="book.screen" 
           [src]="getCorrectBase64(book.screen)" 
           [alt]="book.title"
           class="relative z-10 max-h-full max-w-full object-contain rounded-md shadow-xl group-hover:scale-105 transition-transform duration-300">
      
      <!-- Fallback Graphic if no image -->
      <div *ngIf="!book.screen" 
           class="relative z-10 w-full h-full flex flex-col items-center justify-center p-4 text-center">
        <div class="w-12 h-12 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center mb-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
        <span class="font-serif text-sm font-bold text-pearl line-clamp-2">{{ book.title }}</span>
      </div>

      <!-- Category Tag Pill -->
      <div class="absolute top-2.5 left-2.5 z-20">
        <span [class]="getCategoryClass(book.category)" class="px-2.5 py-1 rounded-full text-xs font-semibold backdrop-blur-md border shadow-md">
          {{ book.category || 'General' }}
        </span>
      </div>

      <!-- Favorite Heart Button -->
      <button (click)="onFavoriteClick($event)" 
              aria-label="Toggle favorite book status"
              class="absolute top-2.5 right-2.5 z-20 w-8 h-8 rounded-full bg-slate-950/80 backdrop-blur-md border border-slate-700/80 flex items-center justify-center text-slate-300 hover:text-rose-400 hover:border-rose-400/50 transition-all shadow-md">
        <svg xmlns="http://www.w3.org/2000/svg" 
             [class]="book.isFavorite ? 'w-4 h-4 fill-rose-500 text-rose-500' : 'w-4 h-4 fill-none stroke-current'" 
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
        </svg>
      </button>
    </div>

    <!-- Book Header Metadata -->
    <div class="space-y-1.5 mb-4">
      <h3 class="font-serif text-xl font-bold text-pearl line-clamp-1 group-hover:text-amber-400 transition-colors">
        {{ book.title }}
      </h3>
      
      <p class="text-xs font-medium text-amber-500/90 flex items-center gap-1">
        <span>By</span>
        <span class="text-slate-300 font-semibold">{{ book.author }}</span>
      </p>

      <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed pt-1">
        {{ book.description }}
      </p>
    </div>
  </div>

  <!-- Progress Bar & Actions Footer -->
  <div class="space-y-3 pt-3 border-t border-slate-800/80 mt-auto">
    <!-- Progress Indicator -->
    <div>
      <div class="flex items-center justify-between text-xs mb-1.5">
        <span class="text-slate-400 flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          {{ book.pages }} Pages
        </span>

        <span [class]="book.progress >= 100 ? 'text-emerald-400 font-bold' : (book.progress > 0 ? 'text-amber-400 font-bold' : 'text-slate-500')">
          {{ book.progress >= 100 ? 'Completed' : (book.progress + '% Read') }}
        </span>
      </div>

      <div class="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden border border-slate-800">
        <div class="h-full rounded-full transition-all duration-500"
             [class]="book.progress >= 100 ? 'bg-gradient-to-r from-emerald-500 to-emerald-300' : 'bg-gradient-to-r from-amber-500 via-amber-400 to-amber-300'"
             [style.width.%]="book.progress"></div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center justify-between gap-2 pt-1">
      <button (click)="onCardClick()" 
              class="gold-btn text-xs py-1.5 px-3 flex-1 justify-center">
        <span>Open Reader</span>
      </button>

      <button *ngIf="book.progress < 100" 
              (click)="onQuickProgressClick($event)" 
              aria-label="Quickly add 10 percent reading progress"
              title="Quick Add 10% Progress" 
              class="ghost-btn text-xs py-1.5 px-2.5 hover:text-amber-300">
        +10%
      </button>
    </div>
  </div>

</div>
